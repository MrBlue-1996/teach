version: '3.8'

services:
  # ===========================================================================
  # API SERVER
  # ===========================================================================
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: topshelf-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-topshelf}
      DB_USER: ${DB_USER:-topshelf}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      SESSION_SECRET: ${SESSION_SECRET:?Session secret required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - topshelf-network
    volumes:
      - api-data:/app/data
      - api-logs:/app/logs
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # POSTGRESQL DATABASE
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: topshelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-topshelf}
      POSTGRES_USER: ${DB_USER:-topshelf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - topshelf-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-topshelf} -d ${DB_NAME:-topshelf}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # REDIS CACHE
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: topshelf-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - topshelf-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # NGINX REVERSE PROXY (Optional)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: topshelf-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - topshelf-network
    profiles:
      - with-nginx

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  topshelf-network:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  api-data:
    driver: local
  api-logs:
    driver: local
