    status: blocked
    blocked_on: Missing authorized/local UJ v0.1.2 source artifact or branch; current manifest is 0.1.1 and local zip source is 0.1.0.
    gates:
      - description: Branch exists
        check: git_branch
        branch: feat/uj-pack-v0.1.2-merge
      - description: PR merged
        check: manual
      - description: validate-packs OK on UJ teaching pack
        check: command
        command: pnpm validate:content-packs
        cwd: .
      - description: Final repo gate green
        check: command
        command: pnpm test && pnpm format:check && pnpm lint && pnpm typecheck && pnpm build
        cwd: .

