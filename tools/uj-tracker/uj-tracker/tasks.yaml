                check: manual
          - id: P4.2.3
            title: Cook sees badge after signoff
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: Real-time visible on cook's phone
                check: manual

      - id: P4.3
        title: Admin onboarding (sequential, you only)
        parallelism: 1
        depends_on: [P4.2]
        tasks:
          - id: P4.3.1
            title: Admin tool to create tenant + bind manager
            agent: you
            status: pending
            gates:
              - description: Onboard a tenant in under 5 minutes
                check: manual

    phase_gate:
      - description: Two tenants exist; isolation verified
        check: manual
      - description: Sign-off loop <30s
        check: manual

  - id: P5
    title: Production Hardening
    sequence: 6
    depends_on: [P4]
    goal: Demo → real product.
    batches:
      - id: P5.1
        title: Monitoring (parallel)
        parallelism: 2
        tasks:
          - id: P5.1.1
            title: Sentry wiring
            agent: claude-code
            status: pending
            gates:
              - description: Intentional throw shows in Sentry dashboard
                check: manual
          - id: P5.1.2
            title: Analytics for stuck patterns
            agent: claude-code
            status: pending
            gates:
              - description: Admin dashboard populates from a week of usage
                check: manual

      - id: P5.2
        title: Legal (sequential, mostly you)
        parallelism: 1
        tasks:
          - id: P5.2.1
            title: Privacy policy draft
            agent: you
            status: pending
            gates:
              - description: /legal/privacy live, attorney-reviewed
                check: manual
          - id: P5.2.2
            title: Terms of service draft
            agent: you
            status: pending
            gates:
              - description: /legal/terms live, attorney-reviewed
                check: manual
          - id: P5.2.3
            title: Footer links + signup checkboxes
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: Cannot sign up without accepting
                check: manual

      - id: P5.3
        title: Accessibility (parallel)
        parallelism: 3
        tasks:
          - id: P5.3.1
            title: axe-core in CI
            agent: claude-code
            status: pending
            gates:
              - description: GitHub Action runs axe-core on every PR
                check: manual
          - id: P5.3.2
            title: Manual screen reader pass
            agent: you
            status: pending
            gates:
              - description: Every screen navigable by VoiceOver/TalkBack
                check: manual
          - id: P5.3.3
            title: Contrast + tap-target audit
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: WCAG 2.2 AA pass via axe + manual
                check: manual

      - id: P5.4
        title: Performance (parallel)
        parallelism: 2
        tasks:
          - id: P5.4.1
            title: Lighthouse CI in pipeline
            agent: claude-code
            status: pending
            gates:
              - description: Main holds Perf 90+, A11y 100, BP 100, PWA installable
                check: manual
          - id: P5.4.2
            title: Bundle size audit
            agent: claude-code
            status: pending
            gates:
              - description: Initial JS bundle <200KB gzipped
                check: manual

      - id: P5.5
        title: Operational (sequential)
        parallelism: 1
        tasks:
          - id: P5.5.1
            title: Backup verification
            agent: claude-code
            status: pending
            gates:
              - description: Test restore works
                check: manual
          - id: P5.5.2
            title: RUNBOOK.md
            agent: you
            status: pending
            gates:
              - description: Doc exists covering every failure mode
                check: file_exists
                path: ~/repos/teach/RUNBOOK.md

    phase_gate:
      - description: Lighthouse all green
        check: manual
      - description: axe-core passes
        check: manual
      - description: Sentry clean for a week
        check: manual
      - description: Legal pages live
        check: manual
      - description: Backups verified
        check: manual

  - id: P6
    title: Pilot
    sequence: 7
    depends_on: [P5]
    goal: 3 real cooks, 4-week observation, go/no-go on broader rollout.
    batches:
      - id: P6.1
        title: Onboard
        parallelism: 1
        tasks:
          - id: P6.1.1
            title: Identify 3 pilot cooks at UJ Arlington
            agent: you
            status: pending
            gates:
              - description: 3 names with permission
                check: manual
          - id: P6.1.2
            title: Onboard manager + cooks on real phones
            agent: you
            status: pending
            gates:
              - description: All 4 logged in, first block started
                check: manual

      - id: P6.2
        title: Observe (4 weeks, weekly)
        parallelism: 1
        cadence: weekly
        tasks:
          - id: P6.2.1
            title: Weekly observation review (Sundays)
            agent: you
            status: pending
            gates:
              - description: 4 weekly summaries written
                check: manual
          - id: P6.2.2
            title: Bug triage + 48h turnaround
            agent: claude-code
            status: pending
            gates:
              - description: No critical bug open longer than a week
                check: manual

      - id: P6.3
        title: Decide
        parallelism: 1
        depends_on: [P6.2]
        tasks:
          - id: P6.3.1
            title: Pilot retro
            agent: you
            status: pending
            gates:
              - description: Go/no-go on broader rollout
                check: manual

    phase_gate:
      - description: 4-week observation complete
        check: manual
      - description: Retro doc written
        check: manual
      - description: Decision made (scale, revise, or pivot)
        check: manual
