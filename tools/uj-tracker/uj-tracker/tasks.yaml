# UJ Pack Production Tracker — Single Source of Truth
#
# This file is read by `bin/uj-tracker` (Node script) to produce
# progress reports. Edit task `status` here, run the tracker, get a
# human-readable dashboard back.
#
# Status values:
#   pending     — not started
#   in-progress — agent assigned, work begun
#   blocked     — waiting on something (note in `blocked_on`)
#   review      — work done, waiting on your review/test
#   done        — all gate criteria met, you've signed off
#   deferred    — explicitly punted to v0.2 or later
#
# Gate `check` types:
#   manual      — you confirm by toggling status to done
#   command     — run a shell command, exit 0 = pass
#   file_exists — check a file is present
#   git_branch  — check a branch exists with at least one commit
#   github_pr   — check a PR is merged (requires gh CLI)

project: uj-pack
repo: peteywee/teach
target: production-ready PWA, mobile-friendly, professionally made
sanity_gate:
  description: |
    If Phase 0 + Phase 1 are not "done" by week 4 from project start,
    three options on the table: (1) cut scope, (2) hire help,
    (3) pause until summer. Don't bleed Phase 1 across 4 months.
  start_date: null # set this when you commit to the bet (e.g. 2026-05-15)
  weeks_to_p1_done: 4

cross_cutting:
  - id: X1
    title: Apply v0.1.2 content pack to repo
    agent: claude-code
    skill: /mnt/skills/user/topshelf-content-pack-authoring/SKILL.md
    status: pending
    blocked_on: null
    gates:
      - description: Branch exists
        check: git_branch
        branch: feat/uj-pack-v0.1.2-merge
      - description: PR merged
        check: manual
      - description: validate-packs OK on uj v1
        check: command
        command: pnpm validate:content-packs
        cwd: ~/repos/teach
      - description: Final gate green
        check: command
        command: pnpm test && pnpm format:check && pnpm lint && pnpm typecheck && pnpm build
        cwd: ~/repos/teach

  - id: X2
    title: Authoring backlog (continuous, 1 block/week)
    agent: you
    skill: /mnt/skills/user/topshelf-content-pack-authoring/SKILL.md
    status: in-progress
    blocked_on: null
    cadence: weekly
    gates:
      - description: Never-ending; review weekly
        check: manual

  - id: X3
    title: Sun Holdings / UJ authorization conversation
    agent: you
    skill: null
    status: pending
    blocked_on: null
    gates:
      - description: Decision memo exists (yes/no/maybe)
        check: file_exists
        path: ~/notes/sun-holdings-auth-decision.md

phases:
  - id: P0
    title: Inventory & Decisions
    sequence: 1
    goal: STATE_OF_THE_REPO.md merged + 4 decisions written down
    batches:
      - id: P0.1
        title: Read & report (parallel)
        parallelism: 5
        tasks:
          - id: P0.1.1
            title: Repo structure inventory
            agent: claude-code
            skill: null
            status: pending
            blocked_on: null
            gates:
              - description: STATE_OF_THE_REPO.md Section 1 written
                check: file_exists
                path: ~/repos/teach/STATE_OF_THE_REPO.md

          - id: P0.1.2
            title: Auth & data flow inventory
            agent: claude-code
            skill: null
            status: pending
            blocked_on: null
            gates:
              - description: STATE_OF_THE_REPO.md Section 2 written
                check: manual

          - id: P0.1.3
            title: Challenge surface forensics
            agent: claude-code
            skill: null
            status: pending
            blocked_on: null
            gates:
              - description: STATE_OF_THE_REPO.md Section 3 written with screenshots
                check: manual

          - id: P0.1.4
            title: Deployment & ops inventory
            agent: claude-code
            skill: null
            status: pending
            blocked_on: null
            gates:
              - description: STATE_OF_THE_REPO.md Section 4 written
                check: manual

          - id: P0.1.5
            title: Run the app on your phone
            agent: you
            skill: null
            status: pending
            blocked_on: null
            gates:
              - description: STATE_OF_THE_REPO.md Section 5 with phone screenshots
                check: manual

      - id: P0.2
        title: Decide (sequential)
        parallelism: 1
        depends_on: [P0.1]
        tasks:
          - id: P0.2.1
            title: Hosting decision (Vercel vs Firebase Hosting vs CF Pages)
            agent: you
            skill: null
            status: pending
            blocked_on: null
            gates:
              - description: Decision in STATE_OF_THE_REPO.md + custom domain reserved
                check: manual

          - id: P0.2.2
            title: Auth confirmation (Firebase Auth, magic link vs email+pw vs SMS)
            agent: you
            skill: null
            status: pending
            blocked_on: null
            gates:
              - description: Decision documented
                check: manual

          - id: P0.2.3
            title: PWA strategy (next-pwa vs hand-rolled SW, offline scope)
            agent: you
            skill: null
            status: pending
            blocked_on: null
            gates:
              - description: Decision documented
                check: manual

          - id: P0.2.4
            title: Pack delivery strategy (bundle vs CDN — v1 should bundle)
            agent: you
            skill: null
            status: pending
            blocked_on: null
            gates:
              - description: Decision documented
                check: manual

    phase_gate:
      - description: STATE_OF_THE_REPO.md merged to main
        check: manual
      - description: All 4 decisions recorded with rationale
        check: manual
      - description: Custom domain reserved
        check: manual

  - id: P1
    title: Walking Skeleton
    sequence: 2
    depends_on: [P0]
    goal: One user, one block, end-to-end on real phone with persisted progress
    batches:
      - id: P1.1
        title: PWA shell (parallel)
        parallelism: 2
        tasks:
          - id: P1.1.1
            title: PWA manifest + icons
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: Lighthouse Installable check passes
                check: manual

          - id: P1.1.2
            title: Service worker (app shell caching)
            agent: claude-code
            skill: null
            status: pending
            gates:
              - description: App shows cached shell when offline
                check: manual

      - id: P1.2
        title: Auth (parallel)
        parallelism: 2
        tasks:
          - id: P1.2.1
            title: Firebase Auth wiring (email/password)
            agent: claude-code
            skill: null
            status: pending
            gates:
              - description: Sign up, log out, log back in, refresh — still signed in
                check: manual

          - id: P1.2.2
            title: Login UI (mobile-first, brand-consistent)
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: Looks right on 320px viewport on real phone
                check: manual

      - id: P1.3
        title: Data layer (parallel)
        parallelism: 2
        tasks:
          - id: P1.3.1
            title: Firestore schema for users + progress
            agent: claude-code
            skill: null
            status: pending
            gates:
              - description: Rules tests pass; cannot read other user's progress
                check: manual

          - id: P1.3.2
            title: Pack reader hook
            agent: claude-code
            skill: /mnt/skills/user/topshelf-content-pack-authoring/SKILL.md
            status: pending
            gates:
              - description: Invalid pack JSON fails build, not runtime
                check: manual

      - id: P1.4
        title: Challenge surface (sequential after P1.3)
        parallelism: 1
        depends_on: [P1.3]
        tasks:
          - id: P1.4.1
            title: Block list (cook home screen)
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: Real device, looks right
                check: manual

          - id: P1.4.2
            title: Block detail + challenge surface (text-only, no stimulus)
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: tb-uj-orientation-safety end-to-end on real phone
                check: manual

      - id: P1.5
        title: Deploy (sequential, end of phase)
        parallelism: 1
        depends_on: [P1.4]
        tasks:
          - id: P1.5.1
            title: Vercel deploy with custom domain + SSL
            agent: you
            skill: null
            status: pending
            gates:
              - description: Live URL, install banner appears on phone
                check: manual

    phase_gate:
      - description: Open URL on phone → install banner → install
        check: manual
      - description: Login → home → block → submit → feedback
        check: manual
      - description: Force close → reopen → progress persisted
        check: manual
      - description: Lighthouse mobile PWA score >= 90
        check: manual

  - id: P2
    title: Stimulus Renderers
    sequence: 3
    depends_on: [P1]
    goal: All 6 stimulus kinds render correctly. All 8 blocks doable.
    batches:
      - id: P2.1
