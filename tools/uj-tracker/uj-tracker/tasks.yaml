            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: Drag all 8 steps on real phone with damp fingers
                check: manual

          - id: P2.1.6
            title: PlainTextStimulus renderer
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: Renders on phone, monospace honored
                check: manual

      - id: P2.2
        title: Discriminator + integration (sequential)
        parallelism: 1
        depends_on: [P2.1]
        tasks:
          - id: P2.2.1
            title: Discriminator router
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: TS exhaustive switch verified
                check: manual

          - id: P2.2.2
            title: Wire stimulus into challenge surface
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: All 6 blocks with stimulus work end-to-end on phone
                check: manual

      - id: P2.3
        title: Real-shift validation
        parallelism: 1
        depends_on: [P2.2]
        tasks:
          - id: P2.3.1
            title: Use it 30 minutes during a real downtime
            agent: you
            skill: null
            status: pending
            gates:
              - description: Friction log captured, P0 vs deferred decided
                check: manual

    phase_gate:
      - description: All 8 UJ blocks playable end-to-end on phone
        check: manual
      - description: Real-shift test done, friction log filed
        check: manual
      - description: Lighthouse mobile still >= 90
        check: manual

  - id: P3
    title: Trigger Engine + Retention
    sequence: 4
    depends_on: [P2]
    goal: Pedagogy works. Modes elevate. Re-prompts schedule.
    batches:
      - id: P3.1
        title: Client-side triggers (parallel)
        parallelism: 3
        tasks:
          - id: P3.1.1
            title: stuck_time timer
            agent: claude-code
            status: pending
            gates:
              - description: Past threshold → hint surfaces
                check: manual
          - id: P3.1.2
            title: repeated_errors counter
            agent: claude-code
            status: pending
            gates:
              - description: Wrong twice → guided breakdown surfaces
                check: manual
          - id: P3.1.3
            title: help_requested button
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: Tap help → explanation visible
                check: manual

      - id: P3.2
        title: Mode state machine (sequential after P3.1)
        parallelism: 1
        depends_on: [P3.1]
        tasks:
          - id: P3.2.1
            title: Mode elevation logic L0→L1→L2→L3→L4
            agent: claude-code
            status: pending
            gates:
              - description: Transitions reproducible from trigger fixtures
                check: manual
          - id: P3.2.2
            title: Mode-specific UI surfaces
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: All 5 modes look right on phone
                check: manual

      - id: P3.3
        title: Retention scheduler (sequential)
        parallelism: 1
        depends_on: [P3.2]
        tasks:
          - id: P3.3.1
            title: Server-side reassessment trigger
            agent: claude-code
            status: pending
            gates:
              - description: Simulated time travel test → block reappears
                check: manual
          - id: P3.3.2
            title: Decay surface affordance
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: You are seeing this again UI present
                check: manual
          - id: P3.3.3
            title: idle_drop and frequency_decline
            agent: claude-code
            status: deferred
            gates:
              - description: Defer to v0.2 if Phase 3 running long
                check: manual

    phase_gate:
      - description: All 5 trigger types work (or 3 + 2 deferred)
        check: manual
      - description: Mode elevation visible
        check: manual
      - description: Retention causes re-prompt at correct interval
        check: manual

  - id: P4
    title: Manager + Multi-Role + Multi-Tenant
    sequence: 5
    depends_on: [P3]
    goal: Credential loop closes. Manager signs off cooks at their tenant.
    batches:
      - id: P4.1
        title: Auth claims (sequential, blocking)
        parallelism: 1
        tasks:
          - id: P4.1.1
            title: Custom claims structure (role + tenantId)
            agent: claude-code
            status: pending
            gates:
              - description: Claims show in decoded JWT for cook + manager
                check: manual
          - id: P4.1.2
            title: Firestore rules with tenant isolation
            agent: claude-code
            status: pending
            gates:
              - description: Manager A cannot read cook progress at tenant B
                check: manual

      - id: P4.2
        title: Manager surfaces (parallel after P4.1)
        parallelism: 3
        depends_on: [P4.1]
        tasks:
          - id: P4.2.1
            title: Manager home (cook list)
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
              - description: Real phone, looks right
                check: manual
          - id: P4.2.2
            title: Cook detail + sign-off
            agent: claude-code
            skill: /mnt/skills/user/top-shelf-ui/SKILL.md
            status: pending
            gates:
