name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'copilot/**'
      - 'claude/**'
    paths-ignore:
      - 'brand/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'brand/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: primary-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      web: ${{ steps.filter.outputs.web }}
      content: ${{ steps.filter.outputs.content }}
      repo: ${{ steps.filter.outputs.repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            content:
              - 'content/**'
              - 'content-packs/**'
              - 'governance/policies/**'
            repo:
              - '.github/**'
              - 'scripts/**'
              - 'eslint.config.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.repo == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.content == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint GitHub Actions workflows
        run: pnpm run workflow:lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint workspace
        run: pnpm run lint

      - name: Type check workspace
        run: pnpm run typecheck

  packages:
    name: Packages build and test
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality
    if: ${{ needs.changes.outputs.repo == 'true' || needs.changes.outputs.packages == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build packages
        run: pnpm run build:packages

      - name: Run package-local tests
        run: pnpm turbo run test --filter='@topshelf/*' --filter='!@topshelf/web' --filter='!@topshelf/tests'

      - name: Run shared CI test suite
        run: pnpm --filter @topshelf/tests run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: packages/tests/coverage/lcov.info
          fail_ci_if_error: false

  web:
    name: Web build and test
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality
    if: ${{ needs.changes.outputs.repo == 'true' || needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build web app
        run: pnpm --filter @topshelf/web run build

      - name: Run web tests
        run: pnpm --filter @topshelf/web run test

  content-validation:
    name: Content validation
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality
    if: ${{ needs.changes.outputs.repo == 'true' || needs.changes.outputs.content == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build packages
        run: pnpm run build:packages

      - name: Validate content packs
        run: pnpm run validate:content-packs

      - name: Package Uncle Julio's demo content pack
        run: pnpm run package:uncle-julios

      - name: Validate policies
        run: pnpm run validate:policies
