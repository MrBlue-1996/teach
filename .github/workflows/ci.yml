name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: primary-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint GitHub Actions workflows
        run: pnpm run workflow:lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint workspace
        run: pnpm run lint

      - name: Type check workspace
        run: pnpm run typecheck

  packages:
    name: Packages build and test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build packages
        run: pnpm run build:packages

      - name: Run package-local tests
        run: pnpm turbo run test --filter='@topshelf/*' --filter='!@topshelf/web' --filter='!@topshelf/tests'

      - name: Run shared CI test suite
        run: pnpm --filter @topshelf/tests run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: packages/tests/coverage/lcov.info
          fail_ci_if_error: false

  web:
    name: Web build and test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build web app
        run: pnpm --filter @topshelf/web run build

      - name: Run web tests
        run: pnpm --filter @topshelf/web run test
