name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: implementations/mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: implementations/mcp-server
        run: npm ci

      - name: Type check
        working-directory: implementations/mcp-server
        run: npm run type-check

      - name: Build
        working-directory: implementations/mcp-server
        run: npm run build

      - name: Run tests
        working-directory: implementations/mcp-server
        run: npm test

      - name: Lint
        working-directory: implementations/mcp-server
        run: npm run lint
        continue-on-error: true
