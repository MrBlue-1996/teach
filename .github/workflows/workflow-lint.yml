name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/actions/**/*.yml'
      - '.github/actions/**/*.yaml'
      - 'scripts/workflow-lint.mjs'
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'copilot/**'
      - 'claude/**'
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/actions/**/*.yml'
      - '.github/actions/**/*.yaml'
      - 'scripts/workflow-lint.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint GitHub Actions workflows
        run: pnpm run workflow:lint
